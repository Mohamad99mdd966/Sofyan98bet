  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-base: #06080d;
      --bg-surface: #0d111a;
      --bg-elevated: #141a27;
      --bg-card: #101521;
      --bg-input: #090c13;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text-main: #f4f7fd;
      --text-muted: #8b96ab;
      --text-dim: #5c667a;
      --gold: #f5b935;
      --gold-2: #d98b12;
      --gold-soft: rgba(245, 185, 53, 0.15);
      --emerald: #10b981;
      --emerald-soft: rgba(16, 185, 129, 0.14);
      --rose: #f43f5e;
      --rose-soft: rgba(244, 63, 94, 0.14);
      --cyan: #22d3ee;
      --violet: #a855f7;
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: "Vazirmatn", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 12% 0%, rgba(245, 185, 53, 0.09), transparent 36%),
        radial-gradient(circle at 88% 8%, rgba(34, 211, 238, 0.07), transparent 34%),
        var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.65;
      overflow-x: hidden;
    }

    button, input, select, textarea { font-family: inherit; color: inherit; }
    button {
      cursor: pointer;
      border: none;
      background: transparent;
      transition: transform 0.14s ease, background 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
    }
    button:active:not(:disabled) { transform: scale(0.98); }
    button:disabled { opacity: 0.48; cursor: not-allowed; }

    input, select, textarea {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(245, 185, 53, 0.15);
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      direction: ltr;
      unicode-bidi: isolate;
    }
    .num { font-variant-numeric: tabular-nums; }

    .app-shell { display: flex; min-height: 100vh; }

    /* Sidebar */
    .sidebar {
      width: 274px;
      flex-shrink: 0;
      background: rgba(13, 17, 26, 0.95);
      border-left: 1px solid var(--border);
      backdrop-filter: blur(18px);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 40;
      transition: transform 0.25s ease;
    }

    .brand {
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }

    .brand-mark {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--gold), var(--gold-2));
      color: #090c11;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 1.3rem;
      box-shadow: 0 8px 24px rgba(245, 185, 53, 0.3);
      flex-shrink: 0;
    }

    .brand-name { font-weight: 900; font-size: 1.08rem; display: flex; align-items: center; gap: 6px; }
    .brand-tag {
      font-size: 0.7rem;
      color: var(--gold);
      background: var(--gold-soft);
      padding: 1px 7px;
      border-radius: 999px;
      font-weight: 800;
    }
    .brand-sub { font-size: 0.75rem; color: var(--text-muted); }
